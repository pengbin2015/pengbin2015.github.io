<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
<title id="title">Four agent deployment patterns</title>
<desc id="desc">A two-by-two matrix comparing individual and shared team workflows vertically and human-initiated and automatically initiated work horizontally.</desc>
<style>
text {font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #162237;}
.title {font-size:30px;font-weight:750;} .subtitle {font-size:17px;fill:#58677a;}
.axis {font-size:19px;font-weight:700;fill:#344a63;} .qtitle {font-size:23px;font-weight:750;} .body {font-size:17px;fill:#42536a;} .example {font-size:15px;fill:#52627a;}
</style>
<rect width="1120" height="700" rx="22" fill="#ffffff"/>
<text x="50" y="59" class="title">Four patterns of agent deployment</text>
<text x="50" y="91" class="subtitle">Who directs the work × how tasks are initiated</text>
<text x="22" y="230" class="axis">Shared team</text><text x="22" y="257" class="axis">workflows</text>
<text x="22" y="476" class="axis">Individual</text><text x="22" y="503" class="axis">workflows</text>
<rect x="180" y="134" width="438" height="232" rx="14" fill="#eaf3f9" stroke="#b8d5e7" stroke-width="2"/>
<rect x="634" y="134" width="438" height="232" rx="14" fill="#e8f3ef" stroke="#a9d4c3" stroke-width="2"/>
<rect x="180" y="382" width="438" height="232" rx="14" fill="#f4f6fa" stroke="#d6dce7" stroke-width="2"/>
<rect x="634" y="382" width="438" height="232" rx="14" fill="#f2eef9" stroke="#d7c7ec" stroke-width="2"/>
<text x="212" y="179" class="qtitle">Shared assistant</text>
<text x="212" y="220" class="body">Multiple people can request work.</text>
<text x="212" y="246" class="body">A person initiates each task.</text>
<text x="212" y="312" class="example">Example: agent mentioned in a shared</text>
<text x="212" y="336" class="example">Slack channel</text>
<text x="666" y="179" class="qtitle">Automated team agent</text>
<text x="666" y="220" class="body">Shared workflow events start work</text>
<text x="666" y="246" class="body">and results are visible to the team.</text>
<text x="666" y="312" class="example">Example: agent triggered by a</text>
<text x="666" y="336" class="example">pull-request event</text>
<text x="212" y="427" class="qtitle">Personal assistant</text>
<text x="212" y="468" class="body">One developer initiates and</text>
<text x="212" y="494" class="body">supervises the task.</text>
<text x="212" y="560" class="example">Example: Claude Code in an</text>
<text x="212" y="584" class="example">individual terminal session</text>
<text x="666" y="427" class="qtitle">Automated personal agent</text>
<text x="666" y="468" class="body">Tasks start automatically but</text>
<text x="666" y="494" class="body">primarily serve one developer.</text>
<text x="666" y="560" class="example">Example: a scheduled personal</text>
<text x="666" y="584" class="example">coding task</text>
<text x="394" y="663" text-anchor="middle" class="axis">Human-initiated</text>
<text x="849" y="663" text-anchor="middle" class="axis">Automatically initiated</text>
</svg>