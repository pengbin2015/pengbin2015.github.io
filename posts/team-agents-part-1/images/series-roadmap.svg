<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="970" viewBox="0 0 1120 970" role="img" aria-labelledby="title desc"><title id="title">Team Agents: eight-post roadmap</title><desc id="desc">All eight posts numbered 01 through 08 and organised into four groups: Foundations, Continuity and control, Accountability, and Putting it together.</desc><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#162237}.title{font-weight:750;font-size:31px}.subtitle{font-size:17px;fill:#59687b}.group{font-size:15px;font-weight:750;fill:#4a5d74;letter-spacing:1px}.groupname{font-size:22px;font-weight:750}.num{font-size:21px;font-weight:800;fill:#273a50}.post{font-size:19px;fill:#23354c}</style><rect width="1120" height="970" rx="24" fill="#fff"/><text x="50" y="58" class="title">Team Agents — Eight-part series</text><text x="50" y="90" class="subtitle">Eight posts organised into four groups</text><rect x="50" y="122" width="1020" height="181" rx="14" fill="#eaf3f9" stroke="#b8d5e7" stroke-width="2"/><text x="78" y="154" class="group">GROUP 1</text><text x="203" y="155" class="groupname">Foundations</text><rect x="78" y="168" width="58" height="42" rx="10" fill="#ffffff" stroke="#b8d5e7" stroke-width="1.6"/><text x="107" y="195" class="num" text-anchor="middle">01</text><text x="161" y="195" class="post">What team agents are and why they are emerging</text><rect x="78" y="222" width="58" height="42" rx="10" fill="#ffffff" stroke="#b8d5e7" stroke-width="1.6"/><text x="107" y="249" class="num" text-anchor="middle">02</text><text x="161" y="249" class="post">Inside real team-agent implementations</text><rect x="50" y="319" width="1020" height="235" rx="14" fill="#e8f3ef" stroke="#a9d4c3" stroke-width="2"/><text x="78" y="351" class="group">GROUP 2</text><text x="203" y="352" class="groupname">Continuity and control</text><rect x="78" y="365" width="58" height="42" rx="10" fill="#ffffff" stroke="#a9d4c3" stroke-width="1.6"/><text x="1